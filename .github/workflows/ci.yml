name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run build
        run: npm run build

      - name: Run tests (hermetic)
        run: npm test

  google-smoke:
    name: Google Gemini live smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    # Pushes only: fork PRs have no secrets. Step-level guard skips if unset.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Live Gemini call via GoogleProvider
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_API_KEY}" ]; then
            echo "GOOGLE_API_KEY secret not set — skipping live smoke test."
            exit 0
          fi
          cat > smoke.mjs <<'EOF'
          import { GoogleProvider } from './dist/core/providers/GoogleProvider.js';

          const provider = new GoogleProvider({
            provider: 'google',
            modelId: 'gemini-2.0-flash',
            apiKey: process.env.GOOGLE_API_KEY,
            maxTokens: 64,
            temperature: 0,
          });

          const validation = await provider.validateConfig();
          if (!validation.valid) {
            console.error('Config invalid:', validation.errors);
            process.exit(1);
          }

          const messages = [
            {
              id: 'm1',
              role: 'system',
              content: [],
              timestamp: new Date(),
              metadata: {},
            },
            {
              id: 'm2',
              role: 'user',
              content: [{ type: 'text', text: 'Reply with exactly: OK' }],
              timestamp: new Date(),
              metadata: {},
            },
          ];

          const response = await provider.sendMessage(messages, [], { maxTokens: 32 });
          console.log('provider=' + response.provider);
          console.log('modelId=' + response.modelId);
          console.log('stopReason=' + response.stopReason);
          console.log('usage=' + JSON.stringify(response.usage));

          const text = response.content
            .filter((c) => c.type === 'text')
            .map((c) => c.text)
            .join('');
          console.log('text=' + JSON.stringify(text));
          if (typeof text !== 'string' || text.length === 0) {
            console.error('FAIL: no text content in response');
            process.exit(1);
          }
          console.log('SMOKE TEST PASSED');
          EOF
          node smoke.mjs
